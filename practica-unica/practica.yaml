apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zot-pvc-abdiel
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: abdiel
  labels:
    app: abdiel
spec:
  containers:
  - name: abdiel
    image: ghcr.io/project-zot/zot-linux-amd64:v2.1.0
    ports:
    - containerPort: 5000
    volumeMounts:
    - name: zot-storage
      mountPath: /var/lib/zot
  volumes:
  - name: zot-storage
    persistentVolumeClaim:
      claimName: zot-pvc-abdiel
  restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: zot-lb-abdiel
  annotations:
    networking.gke.io/load-balancer-ip-address: "34.63.21.214"
spec:
  type: LoadBalancer
  selector:
    app: abdiel
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP
