# rabbit-consumer-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer-rabbit
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer-rabbit
  template:
    metadata:
      labels:
        app: consumer-rabbit
    spec:
      containers:
      - name: consumer-rabbit
        image: d1a0ec9c46ec.ngrok-free.app/rabbit-consumer:latest
        imagePullPolicy: Always
        env:
        - name: RABBITMQ_URL
          value: "amqp://admin:admin123@rabbitmq:5672/"
        - name: VALKEY_SERVICE_URL
          value: "valkey-service:6379"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
