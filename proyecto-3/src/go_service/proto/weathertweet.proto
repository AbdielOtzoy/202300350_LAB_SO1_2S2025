syntax = "proto3";
package weathertweet;

option go_package = "./proto";

// Mensaje que se enviará
message WeatherTweetRequest {
    Municipalities municipality = 1;
    int32 temperature = 2;
    int32 humidity = 3;
    Weathers weather = 4;
}

// Lista de municipios aceptados
enum Municipalities {
    unknown_municipalities = 0;
    mixco = 1;
    guatemala = 2;
    amatitlan = 3;
    chinautla = 4;
}

// Lista de climas aceptados
enum Weathers {
    unknown_weather = 0;
    sunny = 1;
    cloudy = 2;
    rainy = 3;
    foggy = 4;
}

// Respuesta del servidor
message WeatherTweetResponse {
    string status = 1;
    string message_id = 2;
}

// Servicio gRPC para el Servidor 1 (Receptor)
service WeatherTweetService {
    rpc SendTweet (WeatherTweetRequest) returns (WeatherTweetResponse);
}

// Servicio gRPC para los Servidores Publicadores
service WeatherPublisherService {
    // Método para el publicador de RabbitMQ (Servidor 2, en 5021)
    rpc PublishToRabbitMQ (WeatherTweetRequest) returns (WeatherTweetResponse);
    
    // Método para el publicador de Kafka (Servidor 3, en 5052)
    rpc PublishToKafka (WeatherTweetRequest) returns (WeatherTweetResponse); 
}